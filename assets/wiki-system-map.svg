<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="LLM Wiki system map">
  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf4f3"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102a3a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="26" fill="#eef4f2"/>
  <text x="70" y="82" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#14354a">LLM Wiki System Map</text>
  <text x="72" y="122" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#5d6e78">Så valvet förvandlar raw-material till källspårad kunskap</text>
  <g font-family="Inter, -apple-system, Segoe UI, sans-serif" filter="url(#s)">
    <g transform="translate(70 190)">
      <rect width="250" height="142" rx="18" fill="url(#card)"/>
      <text x="28" y="46" font-size="25" font-weight="700" fill="#14354a">Raw Inbox</text>
      <text x="28" y="82" font-size="17" fill="#5d6e78">PDF · MD · Clippings</text>
      <text x="28" y="112" font-size="17" fill="#5d6e78">orört källmaterial</text>
    </g>
    <g transform="translate(410 190)">
      <rect width="250" height="142" rx="18" fill="url(#card)"/>
      <text x="28" y="46" font-size="25" font-weight="700" fill="#14354a">Sources</text>
      <text x="28" y="82" font-size="17" fill="#5d6e78">sammanfattning</text>
      <text x="28" y="112" font-size="17" fill="#5d6e78">källstyrka</text>
    </g>
    <g transform="translate(750 190)">
      <rect width="250" height="142" rx="18" fill="url(#card)"/>
      <text x="28" y="46" font-size="25" font-weight="700" fill="#14354a">Knowledge</text>
      <text x="28" y="82" font-size="17" fill="#5d6e78">concepts · entities</text>
      <text x="28" y="112" font-size="17" fill="#5d6e78">decisions · insights</text>
    </g>
    <g transform="translate(1090 190)">
      <rect width="250" height="142" rx="18" fill="url(#card)"/>
      <text x="28" y="46" font-size="25" font-weight="700" fill="#14354a">Questions</text>
      <text x="28" y="82" font-size="17" fill="#5d6e78">svarbara frågor</text>
      <text x="28" y="112" font-size="17" fill="#5d6e78">öppna luckor</text>
    </g>
  </g>
  <g stroke="#2f6f8f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M330 261 H390"/>
    <path d="M670 261 H730"/>
    <path d="M1010 261 H1070"/>
  </g>
  <g fill="#2f6f8f">
    <path d="M390 261 l-14 -9 v18 z"/>
    <path d="M730 261 l-14 -9 v18 z"/>
    <path d="M1070 261 l-14 -9 v18 z"/>
  </g>
  <g font-family="Inter, -apple-system, Segoe UI, sans-serif">
    <rect x="164" y="438" width="1070" height="170" rx="22" fill="#14354a"/>
    <text x="212" y="494" font-size="27" font-weight="700" fill="#f4f7f6">Designprincip</text>
    <text x="212" y="538" font-size="21" fill="#d7e4e2">Allt viktigt ska kunna spåras tillbaka till en source page.</text>
    <text x="212" y="576" font-size="21" fill="#d7e4e2">Allt osäkert ska markeras som hypotes, lucka eller sekundärkälla.</text>
  </g>
</svg>

