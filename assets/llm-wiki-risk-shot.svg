<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Screenshot of a risk matrix page in the LLM Wiki">
  <rect width="1280" height="820" fill="#f7f6f1"/>
  <rect x="54" y="50" width="1172" height="720" fill="#ffffff" stroke="#d8d6ce"/>
  <text x="96" y="126" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850" fill="#050505">Riskmatris - Sundsvallshärvan</text>
  <rect x="96" y="150" width="96" height="5" rx="2.5" fill="#e0001b"/>
  <text x="96" y="206" font-family="Inter, Arial, sans-serif" font-size="18" fill="#77766f">Wikin skiljer på bekräftade risker, öppna hypoteser och saknade källor.</text>
  <g transform="translate(96 250)">
    <rect width="1088" height="84" fill="#f7f6f1" stroke="#d8d6ce"/>
    <text x="24" y="35" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f6f8f">Bekräftat</text>
    <text x="24" y="61" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2a2a27">EBM-utredning, IT-beslag, revisionskritik och nedskrivning från 550 till 150 miljoner.</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="382" width="340" height="250" fill="#ffffff" stroke="#d8d6ce"/>
    <rect x="96" y="382" width="340" height="12" fill="#e0001b"/>
    <text x="122" y="434" font-size="24" font-weight="850" fill="#050505">Hög risk</text>
    <text x="122" y="476" font-size="16" fill="#77766f">Värdering, politiskt ansvar,</text>
    <text x="122" y="502" font-size="16" fill="#77766f">bolagsstyrning och förtroende.</text>
    <text x="122" y="560" font-size="15" font-weight="800" fill="#e0001b">Kräver primärkällor</text>
    <rect x="470" y="382" width="340" height="250" fill="#ffffff" stroke="#d8d6ce"/>
    <rect x="470" y="382" width="340" height="12" fill="#d18a2f"/>
    <text x="496" y="434" font-size="24" font-weight="850" fill="#050505">Medel risk</text>
    <text x="496" y="476" font-size="16" fill="#77766f">Affärsmodell, etableringar,</text>
    <text x="496" y="502" font-size="16" fill="#77766f">historiska varningssignaler.</text>
    <text x="496" y="560" font-size="15" font-weight="800" fill="#d18a2f">Behöver kontext</text>
    <rect x="844" y="382" width="340" height="250" fill="#ffffff" stroke="#d8d6ce"/>
    <rect x="844" y="382" width="340" height="12" fill="#2f6f8f"/>
    <text x="870" y="434" font-size="24" font-weight="850" fill="#050505">Analysfrågor</text>
    <text x="870" y="476" font-size="16" fill="#77766f">Vad är bevisat, vad är</text>
    <text x="870" y="502" font-size="16" fill="#77766f">spekulativt och vad saknas?</text>
    <text x="870" y="560" font-size="15" font-weight="800" fill="#2f6f8f">Driver nästa steg</text>
  </g>
  <rect x="96" y="682" width="1088" height="1" fill="#d8d6ce"/>
  <text x="96" y="724" font-family="Inter, Arial, sans-serif" font-size="15" fill="#77766f">Source pages → Concepts → Decisions → Insights → Questions</text>
</svg>
